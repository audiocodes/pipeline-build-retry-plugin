<div>
<p><code>build</code> (default) searches the whole log. <code>failedStages</code> searches only the output of the failed top-level stages, starting with the failing step, and leaves out stack frames and the output of passing housekeeping steps such as <code>archiveArtifacts</code> and <code>junit</code>. With no failed stage, the whole log is searched.</p>
</div>
